<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <link rel="stylesheet" href="../alertMessage.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>

<body>

    <div class="alert-box">
        <div class="alert-box-content">
            <h3 class="alert-type">Type</h3>
            <p class="alert-message">Message</p>
            <button onclick="closeAlert()" class="alert-btn">Bağla</button>
        </div>
    </div>

    <div class="admin">

        <aside class="sidebar">

            <div class="brand">
                <a href="/" class="brand-link">Əsas Səhifə</a>
                <h2>Admin Panel</h2>
                <span>Cyber Dashboard</span>
            </div>

            <button class="menu-btn active" data-page="blogs">
                📝 Bloglar
            </button>

            <button class="menu-btn" data-page="messages">
                💬 Mesajlar
            </button>

            <button class="menu-btn" data-page="profile">
                👤 Profil
            </button>

        </aside>

        <main class="content">

            <!-- BLOGS -->

            <section id="blogs-page" class="page active">

                <div class="card">

                    <h2>Blog Yarat</h2>

                    <input type="text" id="nameOfBlog" placeholder="Blog adı">

                    <input type="text" id="linkOfBlog" placeholder="Link">

                    <input type="date" id="dateOfBlog" placeholder="Tarix">

                    <textarea id="paragrafOfBlog" placeholder="Mətn"></textarea>
                    
                    <input type="file" id="coverOfBlog" placeholder="Cover">

                    <button id="createBlog">
                        Yarat
                    </button>

                    <button id="cancelBlog">
                        Ləğv et
                    </button>

                </div>

                <div class="card">

                    <h2>Bloglar</h2>

                    <table>

                        <thead>

                            <tr>
                                <th>Ad</th>
                                <th>Tarix</th>
                                <th>Əməliyyat</th>
                            </tr>

                        </thead>

                        <tbody id="blogsTable">

                        </tbody>

                    </table>

                </div>

            </section>

            <!-- MESSAGES -->

            <section id="messages-page" class="page">

                <div class="messages-container">

                    <!-- LEFT SIDEBAR -->
                    <div class="chat-sidebar">

                        <input id="searchMessage" type="text" placeholder="🔍 Gmail axtar...">

                        <div id="gmails" class="chat-users"></div>

                    </div>

                    <!-- RIGHT CHAT AREA -->
                    <div class="chat-box">

                        <div class="chat-header">
                            <h3 id="activeUser">Gmail seçin</h3>
                        </div>

                        <div id="messages" class="chat-messages">
                            <!-- messages -->
                        </div>

                    </div>

                </div>

            </section>

            <!-- PROFILE -->

            <section id="profile-page" class="page">

                <div class="card">

                    <h2>Profil</h2>

                    <input type="text" id="name">

                    <input type="text" id="surname">

                    <input type="text" id="username">

                    <input type="email" id="gmail">

                    <button id="updateProfile">
                        Yadda Saxla
                    </button>
                    <a href="changePassword.html" class="change-password-link">
                        Şifrəni Dəyiş
                    </a>
                </div>

            </section>

            <div class="loading-container">

                <div class="loading-card">
                    <div class="loading-image"></div>

                    <div class="loading-content">
                        <div class="loading-line w-80"></div>
                        <div class="loading-line w-40"></div>
                        <div class="loading-line w-100"></div>
                        <div class="loading-line w-70"></div>
                    </div>
                </div>

                <div class="loading-card">
                    <div class="loading-image"></div>

                    <div class="loading-content">
                        <div class="loading-line w-75"></div>
                        <div class="loading-line w-35"></div>
                        <div class="loading-line w-100"></div>
                        <div class="loading-line w-60"></div>
                    </div>
                </div>

                <div class="loading-card">
                    <div class="loading-image"></div>

                    <div class="loading-content">
                        <div class="loading-line w-90"></div>
                        <div class="loading-line w-30"></div>
                        <div class="loading-line w-100"></div>
                        <div class="loading-line w-80"></div>
                    </div>
                </div>

            </div>

        </main>

    </div>

    <script type="module" src="./js/admin.js"></script>

    <script src="../alertMessage.js"></script>
</body>

</html>
