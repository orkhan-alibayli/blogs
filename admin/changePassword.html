<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>Document</title>
</head>

<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;

        background:
            radial-gradient(circle at top right,
                rgba(124, 92, 255, .15),
                transparent 30%),
            radial-gradient(circle at bottom left,
                rgba(91, 33, 182, .15),
                transparent 30%),
            #070b22;

        font-family: sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 40px;
    }

    .password-card {

        width: 100%;
        max-width: 700px;

        background:
            rgba(10, 15, 40, .75);

        backdrop-filter: blur(20px);

        border:
            1px solid rgba(124, 92, 255, .15);

        border-radius: 28px;

        padding: 40px;

        box-shadow:
            0 0 40px rgba(124, 92, 255, .08);
    }

    .password-header {

        margin-bottom: 35px;
    }

    .password-header h2 {

        color: white;

        font-size: 32px;

        margin-bottom: 10px;
    }

    .password-header p {

        color: rgba(255, 255, 255, .55);

        line-height: 1.7;
    }

    .input-group {

        margin-bottom: 24px;
    }

    .input-group label {

        display: block;

        color: rgba(255, 255, 255, .8);

        margin-bottom: 10px;

        font-size: 14px;
    }

    .password-input {

        position: relative;
    }

    .password-input input {

        width: 100%;

        height: 62px;

        border-radius: 18px;

        border:
            1px solid rgba(255, 255, 255, .08);

        background:
            rgba(255, 255, 255, .03);

        color: white;

        font-size: 15px;

        padding: 0 60px 0 18px;

        transition: .25s;

        outline: none;
    }

    .password-input input::placeholder {

        color:
            rgba(255, 255, 255, .25);
    }

    .password-input input:focus {

        border-color:
            rgba(124, 92, 255, .8);

        box-shadow:
            0 0 20px rgba(124, 92, 255, .25);
    }

    .password-input i {

        position: absolute;

        top: 50%;
        right: 18px;

        transform: translateY(-50%);

        color:
            rgba(255, 255, 255, .4);

        font-size: 22px;

        cursor: pointer;

        transition: .25s;
    }

    .password-input i:hover {

        color: #8b5cf6;
    }

    #changePasswordBtn {

        width: 100%;

        height: 62px;

        margin-top: 15px;

        border: none;

        border-radius: 18px;

        cursor: pointer;

        font-size: 16px;
        font-weight: 700;

        color: white;

        background:
            linear-gradient(135deg,
                #8b5cf6,
                #5b21b6);

        transition: .25s;
    }

    #changePasswordBtn:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 15px 35px rgba(124, 92, 255, .35);
    }

    #changePasswordBtn:active {

        transform:
            translateY(0);
    }

    .toggle-password:hover {
        color: #8b5cf6;
        transform:
            translateY(-50%) scale(1.15);
    }

    @media (max-width: 992px) {

        body {
            padding: 30px;
        }

        .password-card {
            max-width: 100%;
            padding: 35px;
        }

        .password-header h2 {
            font-size: 28px;
        }
    }

    @media (max-width: 768px) {

        body {
            padding: 20px;
        }

        .password-card {
            padding: 30px 25px;
            border-radius: 24px;
        }

        .password-header {
            margin-bottom: 30px;
        }

        .password-header h2 {
            font-size: 24px;
        }

        .password-header p {
            font-size: 14px;
        }

        .password-input input {
            height: 58px;
            font-size: 14px;
        }

        #changePasswordBtn {
            height: 58px;
            font-size: 15px;
        }
    }

    @media (max-width: 576px) {

        body {
            padding: 15px;
        }

        .password-card {
            padding: 25px 18px;
            border-radius: 20px;
        }

        .password-header h2 {
            font-size: 22px;
        }

        .password-header p {
            font-size: 13px;
            line-height: 1.6;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            font-size: 13px;
        }

        .password-input input {
            height: 54px;
            border-radius: 15px;
            padding: 0 52px 0 15px;
        }

        .password-input i {
            right: 15px;
            font-size: 20px;
        }

        #changePasswordBtn {
            height: 54px;
            border-radius: 15px;
        }
    }

    @media (max-width: 380px) {

        body {
            padding: 10px;
        }

        .password-card {
            padding: 20px 15px;
        }

        .password-header h2 {
            font-size: 20px;
        }

        .password-header p {
            font-size: 12px;
        }

        .password-input input {
            height: 50px;
            font-size: 13px;
        }

        #changePasswordBtn {
            height: 50px;
            font-size: 14px;
        }
    }
</style>

<link rel="stylesheet" href="../alertMessage.css">

<body>

    <div class="alert-box">
        <div class="alert-box-content">
            <h3 class="alert-type">Type</h3>
            <p class="alert-message">Message</p>
            <button onclick="closeAlert()" class="alert-btn">Bağla</button>
        </div>
    </div>


    <section id="change-password-page" class="page">

        <div class="password-card">

            <div class="password-header">

                <h2>Şifrəni Dəyiş</h2>

                <p>
                    Hesabınızın təhlükəsizliyi üçün güclü şifrə istifadə edin.
                </p>

            </div>

            <form id="changePasswordForm" class="password-form">

                <div class="input-group">

                    <label>Köhnə Şifrə</label>

                    <div class="password-input">

                        <input type="password" id="oldPassword" placeholder="Köhnə şifrə">

                        <i class="toggle-password bx bx-hide" data-target="oldPassword">
                        </i>

                    </div>

                </div>

                <div class="input-group">

                    <label>Yeni Şifrə</label>

                    <div class="password-input">

                        <input type="password" id="newPassword" placeholder="Yeni şifrə">

                        <i class="toggle-password bx bx-hide" data-target="newPassword">
                        </i>

                    </div>

                </div>

                <div class="input-group">

                    <label>Yeni Şifrə Təkrarı</label>

                    <div class="password-input">

                        <input type="password" id="repeatPassword" placeholder="Yeni şifrəni təkrar edin">

                        <i class="toggle-password bx bx-hide" data-target="repeatPassword">
                        </i>

                    </div>

                </div>

                <button id="changePasswordBtn">
                    Şifrəni Yenilə
                </button>

            </form>

        </div>

    </section>


    <script type="module">
        import { api } from "../../js/api.js";

        const showAlert = (type, message) => {
            const alertBoxInForm = document.querySelector('.alert-box');
            const alert = {
                type,
                message
            };
            localStorage.setItem('alert', JSON.stringify(alert));
            effectAlert();
            alertBoxInForm.style.display = 'flex';
        };

        const form =
            document.getElementById(
                "changePasswordForm"
            );

        form.addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();

                const oldPassword =
                    document.getElementById(
                        "oldPassword"
                    ).value;

                const newPassword =
                    document.getElementById(
                        "newPassword"
                    ).value;

                const repeatPassword =
                    document.getElementById(
                        "repeatPassword"
                    ).value;

                if (
                    newPassword !== repeatPassword
                ) {

                    showAlert(
                        "error",
                        "Yeni parollar uyğun gəlmir"
                    );

                    return;
                }

                try {

                    const res =
                        await api.patch(
                            "/admin/changePassword",
                            {
                                oldPassword,
                                newPassword
                            }
                        );


                    showAlert(
                        "success",
                        res.message
                    );

                    setTimeout(() => {
                        window.location.href = "/admin/login.html";
                    }, 1500);

                } catch (error) {

                    showAlert(
                        "error",
                        error.message
                    );

                    return;
                }

            }
        );

        document
            .querySelectorAll(".toggle-password")
            .forEach(icon => {

                icon.addEventListener("click", () => {

                    const target =
                        document.getElementById(
                            icon.dataset.target
                        );

                    if (
                        target.type ===
                        "password"
                    ) {

                        target.type = "text";

                        icon.classList.remove(
                            "bx-hide"
                        );

                        icon.classList.add(
                            "bx-show"
                        );

                    } else {

                        target.type =
                            "password";

                        icon.classList.remove(
                            "bx-show"
                        );

                        icon.classList.add(
                            "bx-hide"
                        );
                    }

                });

            });
    </script>

    <script src="../alertMessage.js"></script>
</body>

</html>
