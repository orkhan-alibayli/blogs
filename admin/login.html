<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <title>Admin Login</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f0f1f;
            font-family: Inter, sans-serif
        }

        .login-card {
            width: 380px;
            padding: 30px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4)
        }

        .login-title {
            text-align: center;
            margin-bottom: 25px
        }

        .login-title h1 {
            font-size: 22px;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .login-title p {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 5px;
            color: #fff
        }

        .error {
            font-size: 12px;
            color: #ff4d6d;
            margin-bottom: 10px;
            display: none
        }

        .input-login {
            width: 100% !important;
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            outline: none
        }

        .input-login:focus {
            border-color: #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2)
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #7c3aed, #4f46e5);
            color: #fff;
            cursor: pointer
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3)
        }

        .toggle-password {
            position: absolute;
            top: 12px;
            right: 18px;
            color: rgba(124, 92, 255, .8);
            cursor: pointer;
            transition: .25s;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-title">
            <h1>Admin Panel</h1>
            <p>Daxil olmaq üçün məlumatları yazın</p>
        </div>
        <div class="error" id="errorBox"></div>
        <input type="text" id="username" class="input-login" placeholder="Username">
        <div style="position: relative;">
            <input type="password" id="password" class="input-login" placeholder="Password">
            <i class="toggle-password bx bx-hide" data-target="password"></i>
        </div>

        <button class="login-btn" onclick="login()">Daxil ol</button>
    </div>
    <script type="module">

        const loginBtn = document.querySelector(".login-btn");

        import { api } from "../js/api.js";

        const errorBox = document.getElementById("errorBox");

        window.login = async function () {

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!username || !password) {
                errorBox.style.display = "block";
                errorBox.textContent = "Bütün xanaları doldur!";
                return;
            }
            try {
                loginBtn.textContent = "Daxil olunur...";
                const res = await api.post("/login", { username, password });
                loginBtn.textContent = "Uğurla daxil olundu!";
                errorBox.style.display = "none";
                if (res.isChangePassword) {
                    localStorage.setItem('signed', JSON.stringify(true));
                    window.location.href = "/admin/index.html";
                }
                else {
                    window.location.href = "/admin/changePassword.html";
                }
            } catch (err) {
                errorBox.style.display = "block";
                errorBox.textContent = err.message || "Xəta baş verdi";
            }
            finally {
                loginBtn.textContent = "Daxil ol";
            }
        }

        document
            .querySelectorAll(".toggle-password")
            .forEach(icon => {

                icon.addEventListener("click", () => {

                    const target =
                        document.getElementById(
                            icon.dataset.target
                        );

                    if (!target) return;

                    target.type =
                        target.type === "password"
                            ? "text"
                            : "password";

                    icon.classList.toggle("bx-hide");
                    icon.classList.toggle("bx-show");

                });

            });
    </script>
</body>

</html>
